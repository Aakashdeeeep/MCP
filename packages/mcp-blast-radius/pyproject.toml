[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-blast-radius"
version = "0.1.0"
description = "Policy-gated MCP tools: blast-radius zones, a Cedar policy, human approval, and a lockdown switch between an AI assistant and real-world actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "System_designers (Dhanyashree & Aakashdeep)" }]
keywords = ["mcp", "model-context-protocol", "cedar", "ai-safety", "authorization", "human-in-the-loop"]
dependencies = ["mcp>=2.3,<3", "cedarpy>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.urls]
Source = "https://github.com/Aakashdeeeep/MCP/tree/HEAD/packages/mcp-blast-radius"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_blast_radius"]
